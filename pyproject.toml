[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rtlgym"
version = "0.2.0"
description = "RL environment and eval harness for LLM-generated RTL: compile, lint, hidden cocotb tests, and Yosys PPA as a shaped reward."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ramin Rajaei", email = "iiamramiin@gmail.com" }]
dependencies = ["cocotb>=2.0"]

[project.optional-dependencies]
claude = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-xdist>=3", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/iiamramiin/rtlgym"

[project.scripts]
rtlgym = "rtlgym.cli:main"

[tool.setuptools.packages.find]
include = ["rtlgym*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["needs_tools: requires iverilog, verilator and yosys on PATH"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
