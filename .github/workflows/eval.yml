name: eval

# Runs the Claude agent on the tasks and publishes the results. Manual only: it calls
# the Claude API, which costs money. Needs the repository secret ANTHROPIC_API_KEY
# (Settings > Secrets and variables > Actions).
#
# Default experiment, per model: one first attempt per episode, branched into a "full"
# arm (the agent sees compiler, test, and formal diagnostics between attempts) and a
# "none" arm (it only learns the attempt was not accepted), with the same turn budget.
# The difference measures what tool feedback adds over simply retrying. The run logic
# is in scripts/ci/eval.sh, which also runs locally (AGENT=replay needs no API key).
# The key never reaches the EDA tools: they run with a minimal environment.
on:
  workflow_dispatch:
    inputs:
      models:
        description: "Comma-separated Claude model IDs"
        default: "claude-sonnet-5-5"
        required: true
      tasks:
        description: "Comma-separated task IDs, or 'all' (e.g. popcount16,fifo_sync for a smoke run)"
        default: "all"
        required: true
      samples:
        description: "Episodes per task"
        default: "5"
        required: true
      max_turns:
        description: "Attempts per episode"
        default: "3"
        required: true
      paired:
        description: "Paired arms: one first attempt branched into 'full' and 'none' feedback"
        type: boolean
        default: true
      feedback:
        description: "Feedback arms when not paired (comma-separated: full, summary, none)"
        default: "full,none"
        required: false
      effort:
        description: "Effort level"
        type: choice
        options: ["default", "low", "medium", "high", "xhigh", "max"]
        default: "default"
      workers:
        description: "Episodes run in parallel (4 is safe on the 4-core runner)"
        default: "4"
        required: true

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install EDA tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends iverilog verilator yosys
      - name: Install package
        run: pip install -e ".[claude]"
      - name: Check the API key is set
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add the ANTHROPIC_API_KEY repository secret first."
            exit 1
          fi
      - name: Run the evaluation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODELS: ${{ inputs.models }}
          TASKS: ${{ inputs.tasks }}
          SAMPLES: ${{ inputs.samples }}
          MAX_TURNS: ${{ inputs.max_turns }}
          PAIRED: ${{ inputs.paired }}
          FEEDBACK: ${{ inputs.feedback }}
          EFFORT: ${{ inputs.effort }}
          WORKERS: ${{ inputs.workers }}
          OUT: results
        run: bash scripts/ci/eval.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: results/
